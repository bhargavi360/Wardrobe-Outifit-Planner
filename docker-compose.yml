services:
  mongo:
    image: mongo:7
    container_name: smart-wardrobe-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart-wardrobe-backend
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      # Loaded from backend/.env; MongoDB Atlas is the mirror.
      MONGODB_DATABASE: smart_wardrobe
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
      UPLOADS_DIR: /var/data/uploads
    volumes:
      - wardrobe_uploads:/var/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        WARDROBE_API_ORIGIN: http://backend:8000
    container_name: smart-wardrobe-frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
      WARDROBE_API_ORIGIN: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
  wardrobe_uploads:
